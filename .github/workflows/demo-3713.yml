# Fork-only: the #3713 gates the fork CI run did not cover, on a GitHub-hosted runner (never upstream).
name: Gates 3713 (fork only)
on:
  push:
    branches: [fork-demo-3713]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo xtask layers
      - run: cargo xtask lists
      - run: cargo xtask wasm
