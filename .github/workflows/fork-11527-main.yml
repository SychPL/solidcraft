# Fork-only (never upstream): do the 30 tests the four shards failed in run 41624217317 for
# tangency-labs/solidcraft#11533 fail on main too, on the same GitHub-hosted runners?
name: fork-11527-main
on:
  push:
    branches: [fork-ci-11527-main]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  same-tests:
    strategy:
      fail-fast: false
      matrix:
        build: [main, pr]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SOLIDCRAFT_GPU: software
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.build == 'main' && '4bdffef06180fb3a2e8fbd4b15c7d3f60e55bd11' || '776889aae0b3ed979ecafbcf3d087deee6c1e31c' }}
      - name: Install a software Vulkan driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: The 30 tests (${{ matrix.build }})
        run: >-
          cargo nextest run --workspace --cargo-profile ci --locked --profile ci --no-fail-fast
          -E 'test(=a_later_round_after_opening_blends_the_saved_rounds_again) | test(=corpus_designs_name_alike_every_build_and_fail_where_a_reference_is_gone) | test(=eval::cost_tests::a_tap_marking_searches_only_the_bodies_near_it) | test(=eval::cost_tests::a_tap_marking_still_searches_the_bodies_within_its_reach) | test(=cmd::edit::tests::inserting_variable_fillet_control_preserves_parameters_at_existing_positions) | test(=cmd::file::tests::each_format_has_an_export_command_of_its_own) | test(=cmd::sketch_project::tests::intersection_curve_of_picked_faces_spans_the_whole_surface) | test(=extent_tests::cut_to_the_far_side_of_a_curved_wall) | test(=face_name_tests::a_join_that_makes_the_body_bigger_leaves_round_walls_it_never_touched_alone) | test(=hole_face_tests::a_hole_wider_than_the_part_says_it_removes_all_of_it) | test(=measure_centre_tests::a_fillet_round_a_boss_reports_its_radius) | test(=tests::chord_and_variable_fillets) | test(=tests::fillet_fit_taper_closes_to_a_point) | test(=tests::mirror_placed::dragging_a_mirrored_part_meshes_its_copies_once) | test(=tests::shell_tangent_chain_that_opens_every_face_explains_how_to_keep_walls) | test(=blend::corner_tests::a_round_ending_in_an_earlier_round_matches_both_together) | test(=blend::corner_tests::corner_blends_hold_at_any_scale) | test(=blend_corner::tests::issue2422_vertical_after_separate_bottom_rounds) | test(=blend_corner::tests::three_rounds_at_a_corner) | test(=blend_variable::tests::variable_radius_on_a_box_edge) | test(=blend_variable::tests::variable_radius_with_a_corner_through_a_middle_point) | test(=blend_wrong_way_tests::a_chamfer_that_would_grow_the_part_on_a_convex_edge_is_refused) | test(=corner_g2::tests::a_long_setback_keeps_the_g2_patch_inside_the_box) | test(=corner_g2::tests::curvature_rounds_meet_at_a_g2_corner) | test(=corner_g2::tests::the_box_corner_g2_patch_is_a_closed_solid_curvature_continuous_to_its_neighbours) | test(=fillet_setback_tests::a_setback_not_past_the_radius_is_refused_naming_the_least) | test(=modify_history_tests::fillet_variable_and_chord) | test(=native::tests::box_and_fillet_have_stable_wire_records) | test(=ops::tests::a_variable_round_with_a_corner_in_its_law_is_its_balls_union) | test(=preselect_tests::variable_fillet_round_trip)'
