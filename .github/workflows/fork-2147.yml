# Fork-only (never upstream): checks tangency-labs/solidcraft#2147 (Sketch Offset of four projected
# curves) with the reporter's design, on main and on the commit before #11000.
name: fork-2147
on:
  push:
    branches: [fork-ci-2147]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  offset:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main
            ref: 4bdffef06180fb3a2e8fbd4b15c7d3f60e55bd11
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p solidcraft-cli --profile ci --locked
      - name: The reporter's design (data only)
        run: |
          mkdir "$RUNNER_TEMP/design" "$RUNNER_TEMP/zip"
          curl -sSL -o "$RUNNER_TEMP/zip/2.5.zip" https://github.com/user-attachments/files/34197738/2.5.zip
          unzip -q "$RUNNER_TEMP/zip/2.5.zip" -d "$RUNNER_TEMP/zip/x"
          cp "$RUNNER_TEMP/zip/x/2,5.sc" "$RUNNER_TEMP/design/design.sc"
          # The same design with Sketch2 on the XY plane (its projected points are fixed, the link
          # lost), so its offset is checked even where the face it sat on no longer resolves.
          mkdir "$RUNNER_TEMP/zip/sc" "$RUNNER_TEMP/zip/xy"
          unzip -q "$RUNNER_TEMP/design/design.sc" -d "$RUNNER_TEMP/zip/sc"
          python3 -I - "$RUNNER_TEMP/zip/sc/document.json" "$RUNNER_TEMP/zip/xy/document.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          for f in d["features"]:
              if f.get("name") == "Sketch2":
                  f["plane"] = {"name": "XY", "type": "origin"}
          json.dump(d, open(sys.argv[2], "w", encoding="utf-8"))
          PY
          cp "$RUNNER_TEMP/zip/sc/container.json" "$RUNNER_TEMP/zip/xy/"
          (cd "$RUNNER_TEMP/zip/xy" && zip -q "$RUNNER_TEMP/design/design-xy.sc" document.json container.json)
      - name: The design's timeline as opened
        run: |
          target/ci/solidcraft-cli eval --in "$RUNNER_TEMP/design/design.sc" --json-out "$RUNNER_TEMP/eval.json" || true
          python3 -I - "$RUNNER_TEMP/eval.json" <<'PY' | tee "timeline-${{ matrix.name }}.txt"
          import json, sys
          try:
              v = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception as e:
              sys.exit(f"no eval output: {e}")
          def walk(x, path=""):
              if isinstance(x, dict):
                  for k, y in x.items():
                      if k in ("error", "errors", "warning", "warnings", "status") and y not in (None, [], {}, "", "ok"):
                          print(f"{path}.{k}: {json.dumps(y)[:600]}")
                      walk(y, f"{path}.{k}")
              elif isinstance(x, list):
                  for i, y in enumerate(x):
                      walk(y, f"{path}[{i}]")
          walk(v)
          print("top-level keys:", list(v)[:30] if isinstance(v, dict) else type(v))
          PY
      - name: Sketch2's offset as opened (3 mm), then at 0.5, 1, 3 and 6 mm
        run: |
          mkdir "$RUNNER_TEMP/work"
          cat > "$RUNNER_TEMP/work/summary.py" <<'PY'
          import json, sys
          def found(v):
              if isinstance(v, dict):
                  if "curves" in v and "profiles" in v:
                      yield v
                  for x in v.values():
                      yield from found(x)
              elif isinstance(v, list):
                  for x in v:
                      yield from found(x)
          label, path = sys.argv[1], sys.argv[2]
          print(f"== {label}")
          try:
              out = json.load(open(path, encoding="utf-8"))
          except Exception as e:
              print(f"  no result: {e}")
              sys.exit(0)
          for r in list(found(out))[-1:]:
              for c in r["curves"]:
                  if c["id"] in ("l3", "a3", "l4", "a4"):
                      s, e = c["start_at"], c["end_at"]
                      extra = f" r={c['radius']:.3f}" if c["type"] == "arc" else ""
                      print(f"  {c['id']:3} ({s[0]:9.3f},{s[1]:8.3f}) -> ({e[0]:9.3f},{e[1]:8.3f}){extra}")
              ps = r["profiles"]
              print(f"  profiles: {len(ps)}", [round(p["area_mm2"], 2) for p in ps])
          PY
          inspect='{"command": "sketch.inspect", "params": {"sketch": "Sketch2"}}'
          for design in design design-xy; do
          for d in opened 0.5 1 3 6; do
            if [ "$d" = opened ]; then steps="$inspect"; else
              steps="{\"command\": \"parameters.change\", \"params\": {\"name\": \"d9\", \"expression\": \"$d mm\"}}, $inspect"; fi
            echo "{\"commands\": [$steps]}" > "$RUNNER_TEMP/work/$d.json"
            target/ci/solidcraft-cli run "$RUNNER_TEMP/work/$d.json" --in "$RUNNER_TEMP/design/$design.sc" --results --allow-errors               --json-out "$RUNNER_TEMP/work/out-$d.json" 2> "$RUNNER_TEMP/work/err-$d.txt" || echo "  (exit $?: $(head -c 400 "$RUNNER_TEMP/work/err-$d.txt"))"
            python3 -I "$RUNNER_TEMP/work/summary.py" "$design: d9 = $d" "$RUNNER_TEMP/work/out-$d.json"
            rm -f "$RUNNER_TEMP/work/out-$d.json"
          done
          done | tee "summary-${{ matrix.name }}.txt"
      - name: The join (Extrude3) with and without each body it meets
        run: |
          mkdir -p "$RUNNER_TEMP/joins"
          target/ci/solidcraft-cli script "$RUNNER_TEMP/design/design.sc" --out "$RUNNER_TEMP/joins/script.json"
          python3 -I - "$RUNNER_TEMP/joins/script.json" "$RUNNER_TEMP/joins" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1], encoding="utf-8"))["commands"]
          for name, idx in {"full": [0, 1, 2, 3], "no_tube": [0, 1, 3], "no_lug": [0, 2, 3]}.items():
              json.dump({"commands": [c[i] for i in idx]}, open(f"{sys.argv[2]}/v-{name}.json", "w", encoding="utf-8"))
          PY
          for v in full no_tube no_lug; do
            target/ci/solidcraft-cli eval "$RUNNER_TEMP/joins/v-$v.json" --json-out "$RUNNER_TEMP/joins/e-$v.json" > /dev/null 2>&1 || true
            python3 -I - "$RUNNER_TEMP/joins/e-$v.json" "$v" <<'PY'
          import json, sys
          try:
              v = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception as e:
              sys.exit(print(sys.argv[2], "no output:", e))
          print(sys.argv[2], "bodies", v["body_count"], [(b["name"], round(b["volume_mm3"], 3), b["faces"]) for b in v["bodies"]], [t["error"] for t in v["timeline"] if t["error"]])
          PY
          done | tee "joins-${{ matrix.name }}.txt"
      - name: Sketch1 as solved, and the joined bodies' faces
        run: |
          echo '{"commands": [{"command": "sketch.inspect", "params": {"sketch": "Sketch1"}}]}' > "$RUNNER_TEMP/joins/sk1.json"
          target/ci/solidcraft-cli run "$RUNNER_TEMP/joins/sk1.json" --in "$RUNNER_TEMP/joins/v-no_tube.json" --results --allow-errors --json-out "sketch1-${{ matrix.name }}.json" ||             target/ci/solidcraft-cli run "$RUNNER_TEMP/joins/sk1.json" --in "$RUNNER_TEMP/design/design.sc" --results --allow-errors --json-out "sketch1-${{ matrix.name }}.json" || true
          head -c 3000 "sketch1-${{ matrix.name }}.json"
      - name: The failing join's SMLib inputs (kernel-cases --dumps)
        run: |
          mkdir -p "$RUNNER_TEMP/kc/booleans/2147-join" "$RUNNER_TEMP/dumps"
          cp "$RUNNER_TEMP/joins/v-full.json" "$RUNNER_TEMP/kc/booleans/2147-join/recipe.json"
          echo '{"sources": ["tangency-labs/solidcraft#2147"], "what": "probe", "source": "analytic", "method": "probe", "body_count": 1, "volume_mm3": 276022.772}' > "$RUNNER_TEMP/kc/booleans/2147-join/expected.json"
          target/ci/solidcraft-cli kernel-cases "$RUNNER_TEMP/kc/booleans/2147-join" --json --dumps="$RUNNER_TEMP/dumps" > kernel-case.json || true
          head -c 2000 kernel-case.json; echo
          mkdir -p dumps && cp -r "$RUNNER_TEMP/dumps/." dumps/ && find dumps -type f -exec ls -la {} \;
          for t in dumps/*/*.txt; do echo "== $t"; cat "$t"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offset-${{ matrix.name }}
          path: |
            summary-${{ matrix.name }}.txt
            timeline-${{ matrix.name }}.txt
            joins-${{ matrix.name }}.txt
            sketch1-${{ matrix.name }}.json
            kernel-case.json
            dumps/
