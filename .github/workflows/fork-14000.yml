# Fork-only (never upstream): the SolidCraft #14000 solidcore case, its solidcore-diag pictures, and a
# replay of the report's script on solidcraft-cli built from main and from 4890cebd3 (59a85a164's parent).
name: fork-14000
on:
  push:
    branches: [fork-ci-14000]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: goldens unit tests (solidcraft)
        working-directory: solidcore
        run: cargo test --profile goldens -p goldens --lib solidcraft
      - name: the cases, each step's body written as .smb
        working-directory: solidcore
        run: SOLIDCRAFT_DUMP="$PWD/../dump" cargo run --profile goldens -p goldens -- --solidcraft-cases '14000-*' --no-report
      - name: build solidcore-diag
        working-directory: solidcore
        run: cargo build --release -p diagnostics
      - name: draw every dumped body
        run: |
          set -u
          diag=$(ls solidcore/bin/release/solidcore-diag solidcore/target/release/solidcore-diag 2>/dev/null | head -1)
          echo "diag: $diag"
          for f in dump/*/*.smb; do
            c=$(basename "$(dirname "$f")"); s=$(basename "$f" .smb)
            case "$c" in t[0-9]*) continue;; esac
            for v in "-35,-30" "-60,-20" "0,0" "0,-89"; do
              d="pics/$c/v${v/,/_}"
              mkdir -p "$d"
              "$diag" "$f" --out "$d" --view "$v" > "$d/$s.txt" 2>&1 || echo "FAILED $f $v"
            done
            for v in "-35,-30" "0,0"; do
              d="pics/$c/t${v/,/_}"
              mkdir -p "$d"
              "$diag" "$f" --out "$d" --view "$v" --edges-above 1.5e-5 > "$d/$s.txt" 2>&1 || echo "FAILED $f $v tol"
            done
            echo "== $c/$s"; head -3 "pics/$c/v-35_-30/$s.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-14000
          path: |
            dump
            pics
  replay:
    if: contains(github.event.head_commit.message, '[replay]')
    strategy:
      fail-fast: false
      matrix:
        ref: [main, 4890cebd36eda7e68ee3534a42e52b90baa2418e]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tangency-labs/solidcraft
          ref: ${{ matrix.ref }}
      - run: scripts/ci/build-jobs.sh
      - run: git log --oneline -1
      - run: cargo build --release -p solidcraft-cli
      - name: replay the report's script for each tilt
        run: |
          mkdir -p replay
          for a in 0 0.25 0.5 1 1.5 2 2.5 3 4 5; do
            read sx cz px <<< "$(python3 -c "import math; r = math.radians($a); print(repr(math.sin(r)), repr(math.cos(r)), repr(5 * math.tan(r)))")"
            cat > replay/a$a.json <<JSON
          {"commands": [
            {"command": "solid.box", "params": {"length": 40, "width": 40, "height": 10, "corner": [-20, -20, 0], "body_name": "Block"}},
            {"command": "solid.cylinder", "params": {"radius": 5, "height": 15, "base": [0, 0, 5], "axis": [$sx, 0, $cz], "operation": "join", "targets": ["Block"]}},
            {"command": "solid.fillet", "params": {"body": "Block", "edges": [[$px, 5, 10]], "radius": 1}}
          ]}
          JSON
            echo "=== tilt $a"
            ./target/release/solidcraft-cli run replay/a$a.json --quiet 2>&1 | tail -3 || true
            ./target/release/solidcraft-cli eval replay/a$a.json --json-out replay/a$a.out.json > /dev/null 2>&1 || true
            python3 - "replay/a$a.out.json" <<'PY' || true
          import json, sys
          try:
              o = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception as e:
              print("  no eval output:", e); sys.exit()
          for t in o.get("timeline", []):
              if t.get("error") or t.get("warning"):
                  print("  ", t.get("name"), t.get("error") or t.get("warning"))
          for b in o.get("bodies", []):
              print("  body", b.get("name"), "V", b.get("volume_mm3"), "F/E/V", b.get("faces"), b.get("edges"), b.get("vertices"), "closed", b.get("closed"), "lumps", b.get("lumps", b.get("shells")))
          PY
          done
