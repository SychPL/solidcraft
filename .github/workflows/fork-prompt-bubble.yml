# Fork-only (never upstream): checks for the agent chat prompt bubble fix on GitHub-hosted
# runners, since the fork has no Blacksmith runners.
name: fork-prompt-bubble
on:
  push:
    branches: [fork-ci-prompt-bubble]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Repository checks
        if: always()
        run: |
          cargo xtask assets
          cargo xtask icons
          cargo xtask layers
          cargo xtask ui-containers
          cargo xtask lists
          bash scripts/test-format-pending.sh
      - name: Agent chat tests (ui-egui)
        if: always()
        run: |
          set -o pipefail
          cargo test --profile ci --locked -p solidcraft-ui-egui --lib -- agent_chat 2>&1 | tail -n 80
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo xtask wasm
  tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      SOLIDCRAFT_GPU: software
      SOLIDCRAFT_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install a software Vulkan driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The GPU path tracer's own tests (no engine code) run out of memory or time on 4 vCPUs, and
      # two tests run for hours on these runners, on main too. Failures are graded against
      # tests/KNOWN_FAILING_TESTS, as upstream CI does.
      - name: Tests (the default filter), graded by the known-failing list
        run: |
          status=0
          cargo nextest run --workspace --cargo-profile ci --locked --profile ci --no-tests=pass --partition hash:${{ matrix.shard }}/4 \
            -E 'default() - (package(solidcraft-gpu) & test(/^path::/)) - test(=action_matrix_sample) - test(=render_workspace::tests::progressive_image_controls_route_to_the_registered_host)' || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 100 ]; then exit "$status"; fi
          cargo xtask known-failing --junit target/nextest/ci/junit.xml
  demo:
    strategy:
      fail-fast: false
      matrix:
        build: [main, pr]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOLIDCRAFT_GPU: software
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.build == 'main' && '9e3e403b3f8624a8c312d6fd8552f10280b65514' || github.sha }}
      - name: Install Xvfb and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 xvfb x11-apps imagemagick libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libegl1 libgl1 libx11-xcb1
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p solidcraft --profile ci --locked
      - name: One short prompt and its answer (${{ matrix.build }})
        env:
          BUILD: ${{ matrix.build }}
        run: |
          mkdir -p shots
          # An ACP agent that answers every prompt with one short line.
          cat > "$RUNNER_TEMP/short_agent.py" <<'PY'
          import json, sys
          def send(obj):
              sys.stdout.write(json.dumps(obj) + "\n")
              sys.stdout.flush()
          for line in sys.stdin:
              try:
                  msg = json.loads(line)
              except ValueError:
                  continue
              method, rid = msg.get("method"), msg.get("id")
              if method == "initialize":
                  send({"jsonrpc": "2.0", "id": rid, "result": {"protocolVersion": 1, "agentCapabilities": {}, "agentInfo": {"name": "short-agent", "version": "1"}}})
              elif method == "session/new":
                  send({"jsonrpc": "2.0", "id": rid, "result": {"sessionId": "s1"}})
              elif method == "session/prompt":
                  send({"jsonrpc": "2.0", "method": "session/update", "params": {"sessionId": "s1", "update": {"sessionUpdate": "agent_message_chunk", "content": {"type": "text", "text": "Done: the plate is 6 mm thick now."}}}})
                  send({"jsonrpc": "2.0", "id": rid, "result": {"stopReason": "end_turn"}})
              elif rid is not None:
                  send({"jsonrpc": "2.0", "id": rid, "result": {}})
          PY
          cat > "$RUNNER_TEMP/demo.py" <<'PY'
          import json, os, secrets, socket, subprocess, sys, time
          tmp, build = os.environ["RUNNER_TEMP"], os.environ["BUILD"]
          port = 18847
          token = secrets.token_hex(32)
          xvfb = subprocess.Popen(["Xvfb", ":99", "-screen", "0", "1600x1000x24", "-nolisten", "tcp"], start_new_session=True)
          time.sleep(2)
          env = dict(os.environ, DISPLAY=":99", SOLIDCRAFT_CONTROL_TOKEN=token, SOLIDCRAFT_CONTROL_DIR=os.path.join(tmp, "control"))
          log = open(os.path.join(tmp, "app.log"), "wb")
          app = subprocess.Popen(["target/ci/solidcraft", "--control", str(port)], env=env, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
          deadline = time.monotonic() + 120
          while True:
              try:
                  sock = socket.create_connection(("127.0.0.1", port), timeout=120)
                  break
              except OSError:
                  if app.poll() is not None or time.monotonic() > deadline:
                      sys.exit("the app never listened")
                  time.sleep(0.3)
          io = sock.makefile("rw", encoding="utf-8")
          n = 0
          def call(method, params=None, ok=True):
              global n
              n += 1
              req = {"id": n, "method": method, "params": params or {}}
              if n == 1:
                  req["token"] = token
              io.write(json.dumps(req) + "\n")
              io.flush()
              reply = json.loads(io.readline())
              if ok and reply.get("ok") is not True:
                  sys.exit(f"{method} {params} failed: {reply}")
              return reply
          def shot(name):
              time.sleep(1.5)
              path = os.path.abspath(f"shots/{name}.png")
              r = call("ui.screenshot", {"path": path}, ok=False)
              if r.get("ok") is not True or not os.path.exists(path):
                  print(f"ui.screenshot failed ({r}), taking the X screen instead", flush=True)
                  subprocess.run(["import", "-display", ":99", "-window", "root", path], check=True)
              print(f"shot {path}", flush=True)
          def chat(params=None):
              return call("ui.agent_chat", params or {})["result"]
          def wait_chat(done, what):
              end = time.monotonic() + 60
              while time.monotonic() < end:
                  s = chat()
                  if done(s):
                      return s
                  time.sleep(0.3)
              sys.exit(f"timed out waiting for {what}: {json.dumps(chat())[:3000]}")

          call("ui.resize", {"width": 1600, "height": 1000})
          call("ui.home", {"open": False}, ok=False)
          time.sleep(1.0)
          command = f"python3 -I {os.path.join(tmp, 'short_agent.py')}"
          chat({"add_agent": {"id": "short", "name": "Short agent", "kind": "acp", "command": command}})
          chat({"agent": "short", "open": True, "width": 600})
          chat({"connect": True})
          wait_chat(lambda s: s["state"] == "ready", "the agent to be ready")
          chat({"send": "Make the plate 6 mm thick."})
          wait_chat(lambda s: s["state"] == "ready" and any("agent" in i for i in s["items"]), "the answer")
          shot(f"prompt-and-answer-{build}")
          subprocess.run(["convert", f"shots/prompt-and-answer-{build}.png", "-crop", "610x790+990+165", "+repage", f"shots/panel-{build}.png"], check=False)
          call("app.quit", {"force": True}, ok=False)
          app.wait(timeout=60)
          xvfb.terminate()
          PY
          set -o pipefail
          python3 -I "$RUNNER_TEMP/demo.py" | tee "shots/transcript-$BUILD.txt"
      - if: always()
        run: tail -c 12000 "$RUNNER_TEMP/app.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-${{ matrix.build }}
          path: shots/
