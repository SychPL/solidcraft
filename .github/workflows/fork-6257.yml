# Fork-only (never upstream): checks for tangency-labs/solidcraft#7123 (#6257) on GitHub-hosted
# runners, since the fork has no Blacksmith runners.
name: fork-6257
on:
  push:
    branches: [fork-ci-6257]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  BASE: c553365a2197a689e749389a6fbf707a38df9b61
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Repository checks
        if: always()
        run: |
          cargo xtask assets
          cargo xtask icons
          cargo xtask layers
          cargo xtask ui-containers
          cargo xtask lists
          cargo xtask skills
          cargo xtask i18n --check
          bash scripts/test-format-pending.sh
      - name: Align, walk and format tests (doc, engine), Align dialog tests (ui-egui)
        if: always()
        run: |
          set -o pipefail
          cargo test --profile ci --locked -p solidcraft-doc --lib -- feature_walk format clipboard 2>&1 | tail -n 30
          cargo test --profile ci --locked -p solidcraft-engine --lib -- align features_more 2>&1 | tail -n 60
          cargo test --profile ci --locked -p solidcraft-ui-egui --lib -- align dialogs_all 2>&1 | tail -n 40
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Main itself does not build solidcraft-cli at this base (apps/solidcraft-cli/src/kernel_cases_export.rs
      # imports `geom::brep::Brep`, gone since #11496): leave out only that crate, which this PR does not touch.
      - run: cargo clippy --workspace --exclude solidcraft-cli --all-targets --profile ci --locked -- -D warnings
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo xtask wasm
  tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      SOLIDCRAFT_GPU: software
      SOLIDCRAFT_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install a software Vulkan driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tests of the affected packages (as the pull request's CI picks them), known failures allowed
        run: |
          git diff -z --name-only "$BASE" HEAD -- . ':!.github' > "$RUNNER_TEMP/paths"
          python3 -I scripts/ci/affected.py --paths "$RUNNER_TEMP/paths" | tee "$RUNNER_TEMP/affected"
          full=$(sed -n 's/^full=//p' "$RUNNER_TEMP/affected")
          packages=$(sed -n 's/^packages=//p' "$RUNNER_TEMP/affected")
          # solidcraft-cli does not build on main at this base (see clippy above), so it is left out.
          scope=(--workspace --exclude solidcraft-cli)
          if [ "$full" != true ]; then scope=(); for p in $packages; do [ "$p" = solidcraft-cli ] || scope+=(-p "$p"); done; fi
          junit=${CARGO_TARGET_DIR:-target}/nextest/ci/junit.xml
          rm -f "$junit"
          status=0
          cargo nextest run "${scope[@]}" --cargo-profile ci --locked --profile ci --no-tests=pass --partition hash:${{ matrix.shard }}/4 \
            --ignore-default-filter -E "(default() & not (binary(action_matrix) & test(=action_matrix_sample))) & not (package(=solidcraft-gpu) & test(/^path::/))" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 100 ]; then exit "$status"; fi
          cargo xtask known-failing --junit "$junit"
  screenshots:
    strategy:
      fail-fast: false
      matrix:
        label: [before, after]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOLIDCRAFT_GPU: software
      LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: .github/fork-6257
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.label == 'before' && env.BASE || github.sha }}
          path: app
      - name: Install Xvfb and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 xvfb xauth x11-apps imagemagick libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libegl1 libgl1 libx11-xcb1
      - run: scripts/ci/build-jobs.sh
        working-directory: app
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p solidcraft --profile ci --locked
        working-directory: app
      - name: Align a block onto a sketch circle, then move the circle
        working-directory: app
        run: |
          set -o pipefail
          mkdir -p shots
          python3 -I ../ci/.github/fork-6257/demo.py | tee "shots/transcript-$LABEL.txt"
      - if: always()
        run: tail -c 12000 "$RUNNER_TEMP/app.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.label }}
          path: app/shots/
