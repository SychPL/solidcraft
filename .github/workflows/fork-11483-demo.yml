# Fork-only (never upstream): Inspect > Interference on a heavy check, main vs
# tangency-labs/solidcraft#11541 (#11483), under Xvfb.
name: fork-11483-demo
on:
  push:
    branches: [fork-demo-11483]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  BASE: 4bdffef06180fb3a2e8fbd4b15c7d3f60e55bd11
jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        build: [main, pr]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOLIDCRAFT_GPU: software
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.build == 'main' && env.BASE || github.sha }}
      # The demo script lives only on this fork-only branch.
      - uses: actions/checkout@v4
        with:
          path: fork-ci
          sparse-checkout: .github/fork-11483
      - name: Install Xvfb and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 xvfb xauth libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libegl1 libgl1 libx11-xcb1 imagemagick
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p solidcraft --profile ci --locked
      - name: Interference on a plate with 144 pins, Compute
        env:
          BUILD: ${{ matrix.build }}
        run: |
          set -o pipefail
          mkdir -p out
          python3 -I fork-ci/.github/fork-11483/demo.py target/ci/solidcraft out "$BUILD" | tee "out/transcript-$BUILD.txt"
      - if: always()
        run: tail -c 6000 out/app.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-${{ matrix.build }}
          path: out/
