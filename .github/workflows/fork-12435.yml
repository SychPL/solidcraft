# Fork-only (never upstream): the SolidCraft #12435 solidcore case, its solidcore-diag pictures, and a replay
# of the report's script on solidcraft-cli built from main, v0.40.0-rc.2 and v0.30.1.
name: fork-12435
on:
  push:
    branches: [fork-ci-12435]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: goldens unit tests (solidcraft)
        working-directory: solidcore
        run: cargo test --profile goldens -p goldens --lib solidcraft
      - name: the cases, each step's body written as .smb
        working-directory: solidcore
        run: SOLIDCRAFT_DUMP="$PWD/../dump" cargo run --profile goldens -p goldens -- --solidcraft-cases '12435-*' --no-report
      - name: build solidcore-diag
        working-directory: solidcore
        run: cargo build --release -p diagnostics
      - name: draw every dumped body
        run: |
          set -u
          diag=$(ls solidcore/bin/release/solidcore-diag solidcore/target/release/solidcore-diag 2>/dev/null | head -1)
          echo "diag: $diag"
          for f in dump/*/*.smb; do
            c=$(basename "$(dirname "$f")"); s=$(basename "$f" .smb)
            case "$c" in p_*)
              case "$s" in *result) ;; *) continue;; esac
              d="pics/$c/t-35_-30"; mkdir -p "$d"
              "$diag" "$f" --out "$d" --view "-35,-30" --edges-above 1.5e-5 > "$d/$s.txt" 2>&1 || echo "FAILED $f"
              echo "== $c/$s"; head -1 "$d/$s.txt"
              continue;;
            esac
            for v in "-35,-30" "35,-30" "145,-30" "-145,-30" "0,-89"; do
              d="pics/$c/v${v/,/_}"
              mkdir -p "$d"
              "$diag" "$f" --out "$d" --view "$v" > "$d/$s.txt" 2>&1 || echo "FAILED $f $v"
            done
            for v in "145,-30" "0,-89"; do
              d="pics/$c/t${v/,/_}"
              mkdir -p "$d"
              "$diag" "$f" --out "$d" --view "$v" --edges-above 1.5e-5 > "$d/$s.txt" 2>&1 || echo "FAILED $f $v tol"
            done
            echo "== $c/$s"; head -3 "pics/$c/v-35_-30/$s.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-12435
          path: |
            dump
            pics
  replay:
    if: contains(github.event.head_commit.message, '[replay]')
    strategy:
      fail-fast: false
      matrix:
        ref: [main, v0.40.0-rc.2, v0.30.1]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tangency-labs/solidcraft
          ref: ${{ matrix.ref }}
      - run: scripts/ci/build-jobs.sh || true
      - run: git log --oneline -1
      - run: cargo build --release -p solidcraft-cli
      - name: replay the report's script
        run: |
          mkdir -p replay
          blank='{"command": "solid.cylinder", "params": {"diameter": 70, "height": 10, "base": [0, 0, 0], "operation": "new", "body_name": "Ring", "name": "Blank"}}'
          notch='{"command": "solid.cylinder", "params": {"diameter": 14.5, "height": 12, "base": [36.5, 0, -1], "operation": "cut", "name": "Scallop"}},
            {"command": "solid.fillet", "params": {"edges": [[34.3108, -6.9116, 5], [34.3108, 6.9116, 5]], "radius": 5, "name": "Lobe"}}'
          echo "{\"commands\": [$blank, {\"command\": \"solid.chamfer\", \"params\": {\"edges\": [[-35, 0, 10]], \"distance\": 1, \"name\": \"Ch\"}}]}" > replay/plain.json
          echo "{\"commands\": [$blank, $notch]}" > replay/lobe.json
          for d in 1 0.5 0.2 0.05; do
            echo "{\"commands\": [$blank, $notch, {\"command\": \"solid.chamfer\", \"params\": {\"edges\": [[-35, 0, 10]], \"distance\": $d, \"name\": \"Ch\"}}]}" > replay/ch$d.json
          done
          for f in plain lobe ch1 ch0.5 ch0.2 ch0.05; do
            echo "=== $f"
            start=$(date +%s.%N)
            timeout 600 ./target/release/solidcraft-cli eval replay/$f.json --json-out replay/$f.out.json > replay/$f.eval.txt 2>&1 || true
            end=$(date +%s.%N)
            echo "  eval took $(python3 -c "print(round($end - $start, 1))") s"
            tail -4 replay/$f.eval.txt
            python3 - "replay/$f.out.json" <<'PY' || true
          import json, sys
          try:
              o = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception as e:
              print("  no eval json:", e); sys.exit()
          for t in o.get("timeline", []):
              if t.get("error") or t.get("warning"):
                  print("  ", t.get("name"), t.get("error") or t.get("warning"))
          for b in o.get("bodies", []):
              print("  body", b.get("name"), "V", b.get("volume_mm3"), "F/E/V", b.get("faces"), b.get("edges"), b.get("vertices"), "closed", b.get("closed"), "lumps", b.get("lumps", b.get("shells")))
          PY
            timeout 600 ./target/release/solidcraft-cli run replay/$f.json 2>&1 | tail -3 || true
          done
