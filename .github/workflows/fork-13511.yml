# Fork-only (never upstream): checks for tangency-labs/solidcraft#14307 (#13511) on GitHub-hosted
# runners, since the fork has no Blacksmith runners.
name: fork-13511
on:
  push:
    branches: [fork-ci-13511]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Repository checks
        if: always()
        run: |
          cargo xtask layers
          cargo xtask ui-containers
          cargo xtask lists
          cargo xtask mesh-decisions
      - name: Motion dialog tests (ui-egui)
        if: always()
        run: |
          set -o pipefail
          cargo test --profile ci --locked -p solidcraft-ui-egui --lib -- dialogs_motion 2>&1 | grep -E '^(test |test result|running)'
  before:
    # The regression test alone on main (commit cb28e4c7c = main + the test, no fix): it must fail.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cb28e4c7cf697e750baa639fb1db9d96dcb45c8c
          fetch-depth: 0
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: The new test on main, without the fix
        run: |
          set +e
          cargo test --profile ci --locked -p solidcraft-ui-egui --lib -- dialogs_motion::tests::a_step_that_puts_a_part_back_shows_it_there > "$RUNNER_TEMP/before.txt" 2>&1
          grep -E "^(test |test result|thread|  left|  right|assertion)" "$RUNNER_TEMP/before.txt"
          if grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/before.txt"; then echo "the test passed without the fix: it does not reproduce #13511"; exit 1; fi
          if grep -q "1 failed" "$RUNNER_TEMP/before.txt"; then echo "as expected: the test fails on main without the fix"; exit 0; fi
          tail -n 40 "$RUNNER_TEMP/before.txt"; exit 1
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo xtask wasm
  tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      SOLIDCRAFT_GPU: software
      SOLIDCRAFT_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install a software Vulkan driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # As upstream's pull request tests: the packages the change reaches (scripts/ci/affected.py),
      # graded against tests/KNOWN_FAILING_TESTS.
      - name: Tests (the affected packages, the pull request's default filter)
        run: |
          printf '%s\0' crates/ui-egui/src/dialogs_motion.rs > "$RUNNER_TEMP/paths"
          python3 -I scripts/ci/affected.py --paths "$RUNNER_TEMP/paths" | tee "$RUNNER_TEMP/affected"
          scope=(--workspace)
          if [ "$(sed -n 's/^full=//p' "$RUNNER_TEMP/affected")" != true ]; then
            scope=(); for p in $(sed -n 's/^packages=//p' "$RUNNER_TEMP/affected"); do scope+=(-p "$p"); done
          fi
          junit=target/nextest/ci/junit.xml
          rm -f "$junit"
          status=0
          cargo nextest run "${scope[@]}" --cargo-profile ci --locked --profile ci --no-tests=pass --partition hash:${{ matrix.shard }}/4 \
            -E 'default() - (package(solidcraft-gpu) & test(/^path::/)) - test(=action_matrix_sample)' || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 100 ]; then exit "$status"; fi
          cargo xtask known-failing --junit "$junit"
