# Fork-only (never upstream): the SolidCraft #13519 solidcore case, its solidcore-diag pictures, and a
# replay of the report's reduction on solidcraft-cli built from main and from kernel.
name: fork-13519
on:
  push:
    branches: [fork-ci-13519]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: goldens unit tests (solidcraft)
        working-directory: solidcore
        run: cargo test --profile goldens -p goldens --lib solidcraft
      - name: the cases, each step's body written as .smb
        working-directory: solidcore
        run: SOLIDCRAFT_DUMP="$PWD/../dump" cargo run --profile goldens -p goldens -- --solidcraft-cases '13519-*' --no-report
      - name: build solidcore-diag
        working-directory: solidcore
        run: cargo build --release -p diagnostics
      - name: draw every dumped body
        run: |
          set -u
          diag=$(ls solidcore/bin/release/solidcore-diag solidcore/target/release/solidcore-diag 2>/dev/null | head -1)
          echo "diag: $diag"
          for f in dump/*/*.smb; do
            c=$(basename "$(dirname "$f")"); s=$(basename "$f" .smb)
            for v in "-35,30" "-35,-30" "-60,-25" "-90,0" "0,89"; do
              d="pics/$c/v${v/,/_}"
              mkdir -p "$d"
              "$diag" "$f" --out "$d" --view "$v" > "$d/$s.txt" 2>&1 || echo "FAILED $f $v"
            done
            echo "== $c/$s"; head -3 "pics/$c/v-35_30/$s.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-13519
          path: |
            dump
            pics
  replay:
    strategy:
      fail-fast: false
      matrix:
        ref: [main, kernel]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tangency-labs/solidcraft
          ref: ${{ matrix.ref }}
      - run: scripts/ci/build-jobs.sh
      - run: git log --oneline -1
      - run: cargo build --release -p solidcraft-cli
      - name: replay the reduction for each gap
        run: |
          mkdir -p replay
          for g in 0 0.00001 0.00002 0.00003 0.00005 0.00007 0.0001 0.0002 0.001; do
            cat > replay/g$g.json <<EOF
          {"commands": [
            {"command": "solid.box", "params": {"length": 8, "width": 20, "height": 20, "corner": [0, 0, 0], "body_name": "Wall"}},
            {"command": "sketch.create", "params": {"plane": "XY", "name": "S"}},
            {"command": "sketch.line", "params": {"points": [[-20, 5], [0, 5]]}},
            {"command": "sketch.line", "params": {"points": [[0, 5], [-$g, 10]]}},
            {"command": "sketch.line", "params": {"points": [[-$g, 10], [-20, 10]]}},
            {"command": "sketch.line", "params": {"points": [[-20, 10], [-20, 5]]}},
            {"command": "sketch.finish", "params": {}},
            {"command": "solid.extrude", "params": {"sketch": "S", "distance": 10, "operation": "join", "targets": ["Wall"]}}
          ]}
          EOF
            echo "=== gap $g"
            ./target/release/solidcraft-cli run replay/g$g.json --quiet 2>&1 | tail -3 || true
            ./target/release/solidcraft-cli eval replay/g$g.json --json-out replay/g$g.out.json > /dev/null 2>&1 || true
            python3 - "replay/g$g.out.json" <<'PY' || true
          import json, sys
          try:
              o = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception as e:
              print("  no eval output:", e); sys.exit()
          for t in o.get("timeline", []):
              if t.get("error") or t.get("warning"):
                  print("  ", t.get("name"), t.get("error") or t.get("warning"))
          for b in o.get("bodies", []):
              print("  body", b.get("name"), "V", b.get("volume_mm3"), "F/E/V", b.get("faces"), b.get("edges"), b.get("vertices"), "closed", b.get("closed"), "lumps", b.get("lumps", b.get("shells")))
          PY
          done
