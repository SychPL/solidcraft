name: hlr-stress
on: push
jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libgtk-3-dev libxkbcommon-dev libwayland-dev
      - shell: bash
        run: |
          mkdir -p hlr-out
          for i in 1 2 3; do
            HLR_OUT=hlr-out cargo test --release -q -p solidcraft-engine --lib hlr_investigation -- --ignored --nocapture --test-threads 1 > run-$i.txt 2>&1
            echo "run $i exit $?"
            grep -E "^[a-z]+/[a-z]+: |test result|panicked|overflow|STATUS|exit code" run-$i.txt | sed -E 's/"compare_with_dxf".*//' | cut -c1-200
          done
