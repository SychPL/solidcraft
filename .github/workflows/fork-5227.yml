# Fork-only (never upstream): checks for tangency-labs/solidcraft#5350 (#5227) on GitHub-hosted
# runners. Run 39932878605 covered everything else at the same PR head; this re-runs only the
# web app's wasm32 clippy without linting its dependencies (crates/io trips drop_non_drop there).
name: fork-5227
on:
  push:
    branches: [fork-ci-5227]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  wasm-clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Clippy for the browser (web app only)
        run: cargo clippy --target wasm32-unknown-unknown -p solidcraft-web --profile ci --locked --no-deps -- -D warnings
