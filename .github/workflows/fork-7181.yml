# Fork-only (never upstream): checks for tangency-labs/solidcraft#7216 (#7181) on GitHub-hosted
# runners, since the fork has no Blacksmith runners.
name: fork-7181
on:
  push:
    branches: [fork-ci-7181]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Repository checks
        if: always()
        run: |
          cargo xtask assets
          cargo xtask icons
          cargo xtask layers
          cargo xtask ui-containers
          cargo xtask lists
          bash scripts/test-format-pending.sh
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo xtask wasm
  tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      SOLIDCRAFT_GPU: software
      SOLIDCRAFT_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install a software Vulkan driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The GPU path tracer's own tests (no engine code) run out of memory or time on 4 vCPUs.
      - name: Tests (the pull request's default filter)
        run: >-
          cargo nextest run --workspace --cargo-profile ci --locked --profile ci --no-tests=pass --partition hash:${{ matrix.shard }}/4
          -E 'default() - (package(solidcraft-gpu) & test(/^path::/))'
  # The scope's Windows rules (text judged before resolving, long names, verbatim prefixes).
  windows-scope:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Path scope tests (io, mcp)
        shell: bash
        run: |
          set -o pipefail
          cargo test -p solidcraft-io --profile ci --locked -- vfs::
          cargo test -p solidcraft-mcp --profile ci --locked -- folder
  # An MCP agent bridged to the app under Xvfb, before (main) and after (this change).
  transcript:
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: main
            repo: tangency-labs/solidcraft
            ref: aa883603579faa7ca166eb5954c5370e9f89210c
          - side: pr
            repo: ""
            ref: ""
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOLIDCRAFT_GPU: software
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo || github.repository }}
          ref: ${{ matrix.ref || github.sha }}
      - name: Install Xvfb and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 xvfb xauth libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libegl1 libgl1 libx11-xcb1
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p solidcraft -p solidcraft-cli --profile ci --locked
      - name: An agent saves beside the design it worked on
        run: |
          cat > "$RUNNER_TEMP/transcript.py" <<'PY'
          import json, os, secrets, socket, subprocess, sys, time
          home = os.path.expanduser("~")
          designs, other = os.path.join(home, "Designs"), os.path.join(home, "Other")
          for d in (designs, other, os.path.join(designs, ".hidden")):
              os.makedirs(d, exist_ok=True)
          short = lambda s: s.replace(home, "~")
          token = secrets.token_hex(32)
          env = dict(os.environ, SOLIDCRAFT_CONTROL_TOKEN=token, SOLIDCRAFT_CONTROL_DIR=os.path.join(os.environ["RUNNER_TEMP"], "control"))
          log = open(os.path.join(os.environ["RUNNER_TEMP"], "app.log"), "wb")
          app = subprocess.Popen(["xvfb-run", "-a", "-s", "-screen 0 1600x1000x24 -nolisten tcp", "target/ci/solidcraft", "--control", "18846"],
                                 env=env, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
          deadline = time.monotonic() + 120
          while True:
              try:
                  conn = socket.create_connection(("127.0.0.1", 18846), timeout=60)
                  break
              except OSError:
                  if app.poll() is not None or time.monotonic() > deadline:
                      sys.exit("the app never listened")
                  time.sleep(0.3)
          io = conn.makefile("rw")
          def control(n, method, params):
              req = {"id": n, "method": method, "params": params}
              if n == 1:
                  req["token"] = token
              io.write(json.dumps(req) + "\n")
              io.flush()
              reply = json.loads(io.readline())
              if reply.get("ok") is not True:
                  sys.exit(f"{method} failed: {reply}")
          # The user's own part, saved in ~/Designs from the app (not through the agent).
          print("# In the app (the user, on the control port): a box saved as ~/Designs/part.solidcraft")
          control(1, "engine.execute", {"command": "solid.box", "params": {"length": 30, "width": 20, "height": 10}})
          control(2, "engine.execute", {"command": "file.save_as", "params": {"path": os.path.join(designs, "part.solidcraft")}})
          err = open(os.path.join(os.environ["RUNNER_TEMP"], "mcp.err"), "w+")
          mcp = subprocess.Popen(["target/ci/solidcraft-cli", "mcp", "--connect", "127.0.0.1:18846", "--token", token],
                                 stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=err, text=True)
          ids = iter(range(1, 1000))
          def rpc(method, params, notify=False):
              msg = {"jsonrpc": "2.0", "method": method, "params": params}
              if not notify:
                  msg["id"] = next(ids)
              mcp.stdin.write(json.dumps(msg) + "\n")
              mcp.stdin.flush()
              return None if notify else json.loads(mcp.stdout.readline())
          rpc("initialize", {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "transcript", "version": "1"}})
          rpc("notifications/initialized", {}, notify=True)
          print("# The agent, through `solidcraft-cli mcp --connect` with its default folders")
          steps = [
              ("save", {"path": os.path.join(designs, "part-copy.solidcraft")}),
              ("new_design", {"name": "Part 2"}),
              ("execute", {"command": "solid.box", "params": {"length": 12, "width": 12, "height": 12}}),
              ("save", {"path": os.path.join(designs, "part-2.solidcraft")}),
              ("save", {"path": os.path.join(other, "part-2.solidcraft")}),
              ("save", {"path": os.path.join(designs, ".hidden", "part-2.solidcraft")}),
          ]
          for name, args in steps:
              r = rpc("tools/call", {"name": name, "arguments": args})
              res = r.get("result", {})
              text = " ".join(c.get("text", "") for c in res.get("content", []) if c.get("type") == "text")
              print(f"> {name} {short(json.dumps(args, separators=(',', ':')))}")
              if res.get("isError") or "error" in r:
                  print(f"< error: {short(text or json.dumps(r.get('error')))}")
              else:
                  try:
                      body = json.loads(text)
                  except ValueError:
                      body = None
                  print("< ok" + (f" ({short(body['path'])})" if isinstance(body, dict) and "path" in body else ""))
          mcp.stdin.close()
          mcp.wait(timeout=60)
          saved = sorted(short(os.path.join(dp, f)) for dp, _, fs in os.walk(home) if dp.startswith((designs, other)) for f in fs if f.endswith(".solidcraft"))
          print("# On disk: " + ", ".join(saved))
          err.seek(0)
          print("# Server's stderr: " + short(err.read().strip()))
          control(3, "app.quit", {"force": True})
          app.wait(timeout=60)
          PY
          set -o pipefail
          python3 -I "$RUNNER_TEMP/transcript.py" | tee transcript-${{ matrix.side }}.txt
      - if: always()
        run: tail -c 12000 "$RUNNER_TEMP/app.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcript-${{ matrix.side }}
          path: transcript-${{ matrix.side }}.txt
