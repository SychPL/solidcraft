# Fork-only (never upstream): checks for tangency-labs/solidcraft#11146 (#9687) on GitHub-hosted
# runners, since the fork has no Blacksmith runners.
name: fork-9687
on:
  push:
    branches: [fork-ci-9687]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The pull request's base on main: the "before" screenshots build its engine.
  BASE: 3c806394b06b2567d247ee779148ce4a62307225
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Repository checks
        if: always()
        run: |
          set -o pipefail
          cargo xtask assets
          cargo xtask icons
          cargo xtask layers
          cargo xtask ui-containers
          cargo xtask lists
          cargo xtask i18n --check
          cargo xtask skills
          bash scripts/test-format-pending.sh
      - name: Joint tests (engine)
        if: always()
        run: |
          set -o pipefail
          cargo test --profile ci --locked -p solidcraft-engine --lib -- cmd::joints:: schema:: hostile 2>&1 | tail -n 80
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo xtask wasm
  tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      SOLIDCRAFT_GPU: software
      SOLIDCRAFT_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install a software Vulkan driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The GPU path tracer's own tests (no engine code) run out of memory or time on 4 vCPUs, and
      # two tests run for hours on these runners, on main too.
      - name: Tests (the pull request's default filter)
        run: >-
          cargo nextest run --workspace --cargo-profile ci --locked --profile ci --no-tests=pass --partition hash:${{ matrix.shard }}/4
          -E 'default() - (package(solidcraft-gpu) & test(/^path::/)) - test(=action_matrix_sample) - test(=render_workspace::tests::progressive_image_controls_route_to_the_registered_host)'
  screenshots:
    strategy:
      fail-fast: false
      matrix:
        build: [before, after]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOLIDCRAFT_GPU: software
    steps:
      - uses: actions/checkout@v4
      - name: Main's crates (before)
        if: matrix.build == 'before'
        run: |
          git fetch --depth=1 origin "$BASE"
          git checkout FETCH_HEAD -- crates
          git status --short
      - name: Install Xvfb and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 xvfb xauth x11-apps imagemagick libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libegl1 libgl1 libx11-xcb1
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p solidcraft --profile ci --locked
      - name: The report's design (Drucker.sc, attached to #9687)
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          curl -sSfL -o "$RUNNER_TEMP/report/Drucker.zip" https://github.com/user-attachments/files/34201199/Drucker.zip
          python3 -I -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$RUNNER_TEMP/report/Drucker.zip" "$RUNNER_TEMP/report"
          ls -la "$RUNNER_TEMP/report"
      - name: Edit Joint's OK on a conflicting second planar joint, through the control channel
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/demo"
          python3 -I .github/fork-9687/demo.py target/ci/solidcraft "$RUNNER_TEMP/demo" "$RUNNER_TEMP/report/Drucker.sc" 2>&1 | tee "$RUNNER_TEMP/demo/transcript.txt"
      - if: always()
        run: tail -c 12000 "$RUNNER_TEMP/demo/app.log" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.build }}
          path: ${{ runner.temp }}/demo
