# Fork-only (never upstream): the SolidCraft #14415 solidcore case, its solidcore-diag pictures, and a replay
# of the report's script on solidcraft-cli built from main, v0.40.0-rc.3 and v0.30.1.
name: fork-14415
on:
  push:
    branches: [fork-ci-14415]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: goldens unit tests (solidcraft)
        working-directory: solidcore
        run: cargo test --profile goldens -p goldens --lib solidcraft
      - name: the cases, each step's body written as .smb
        working-directory: solidcore
        run: SOLIDCRAFT_DUMP="$PWD/../dump" cargo run --profile goldens -p goldens -- --solidcraft-cases '14415-*' --no-report
      - name: build solidcore-diag
        working-directory: solidcore
        run: cargo build --release -p diagnostics
      - name: draw every dumped body
        run: |
          set -u
          diag=$(ls solidcore/bin/release/solidcore-diag solidcore/target/release/solidcore-diag 2>/dev/null | head -1)
          echo "diag: $diag"
          for f in dump/*/*.smb; do
            c=$(basename "$(dirname "$f")"); s=$(basename "$f" .smb)
            case "$c" in p_*) continue;; esac
            for v in "-35,-30" "-60,-20" "35,-30" "0,0" "0,-89"; do
              d="pics/$c/v${v/,/_}"
              mkdir -p "$d"
              "$diag" "$f" --out "$d" --view "$v" > "$d/$s.txt" 2>&1 || echo "FAILED $f $v"
            done
            d="pics/$c/t-35_-30"; mkdir -p "$d"
            "$diag" "$f" --out "$d" --view "-35,-30" --edges-above 1.5e-5 > "$d/$s.txt" 2>&1 || echo "FAILED $f tol"
            echo "== $c/$s"; head -3 "pics/$c/v-35_-30/$s.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-14415
          path: |
            dump
            pics
  replay:
    if: contains(github.event.head_commit.message, '[replay]')
    strategy:
      fail-fast: false
      matrix:
        ref: [main, v0.40.0-rc.3, v0.30.1]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tangency-labs/solidcraft
          ref: ${{ matrix.ref }}
      - run: scripts/ci/build-jobs.sh || true
      - run: git log --oneline -1
      - run: cargo build --release -p solidcraft-cli
      - name: replay the report's script
        run: |
          mkdir -p replay
          mk() { # name target-angle tool-angle hole-profile-commands
            cat > replay/$1.json <<JSON
          {"commands":[
           {"command":"sketch.create","params":{"plane":"XY","name":"O"}},
           {"command":"sketch.line","params":{"points":[[2,0],[8,0],[8,6],[2,6]],"closed":true}},
           {"command":"sketch.finish","params":{}},
           {"command":"solid.revolve","params":{"sketch":"O","axis":"y","angle":"$2 deg","body_name":"B"}},
           {"command":"sketch.create","params":{"plane":"XY","name":"H"}},
           $4,
           {"command":"sketch.finish","params":{}},
           {"command":"solid.revolve","params":{"sketch":"H","axis":"y","angle":"$3 deg","body_name":"T"}},
           {"command":"solid.combine","params":{"target":"B","tools":["T"],"operation":"cut"}}
          ]}
          JSON
          }
          circle='{"command":"sketch.circle.center","params":{"center":[5,3],"radius":1.5}}'
          square='{"command":"sketch.line","params":{"points":[[3.5,1.5],[6.5,1.5],[6.5,4.5],[3.5,4.5]],"closed":true}}'
          mk c90 90 90 "$circle"
          mk c90t100 90 100 "$circle"
          mk c90t80 90 80 "$circle"
          mk s90 90 90 "$square"
          for t in 10 45 180 270 360; do mk c$t $t $t "$circle"; done
          for f in c90 c90t100 c90t80 s90 c10 c45 c180 c270 c360; do
            echo "=== $f"
            timeout 600 ./target/release/solidcraft-cli eval replay/$f.json --json-out replay/$f.out.json > replay/$f.eval.txt 2>&1 || true
            tail -3 replay/$f.eval.txt
            python3 - "replay/$f.out.json" <<'PY' || true
          import json, sys
          try:
              o = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception as e:
              print("  no eval json:", e); sys.exit()
          for t in o.get("timeline", []):
              if t.get("error") or t.get("warning"):
                  print("  ", t.get("name"), t.get("error") or t.get("warning"))
          for b in o.get("bodies", []):
              print("  body", b.get("name"), "V", b.get("volume_mm3"), "F/E/V", b.get("faces"), b.get("edges"), b.get("vertices"), "closed", b.get("closed"))
          PY
            timeout 600 ./target/release/solidcraft-cli run replay/$f.json 2>&1 | tail -2 || true
          done
