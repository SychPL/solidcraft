# Fork-only (never upstream): checks for tangency-labs/solidcraft#6986 (#6985) on GitHub-hosted
# runners, since the fork has no Blacksmith runners.
name: fork-6985
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Repository checks
        if: always()
        run: |
          cargo xtask assets
          cargo xtask icons
          cargo xtask layers
          cargo xtask ui-containers
          cargo xtask lists
          bash scripts/test-format-pending.sh
      - name: Control tests (engine, ui-egui, app)
        if: always()
        run: |
          cargo test --profile ci --locked -p solidcraft -- control_server
          cargo test --profile ci --locked -p solidcraft-ui-egui --lib -- control::tests::subscribed_frames_publish_the_design control::tests::document_revision
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo xtask wasm
  tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      SOLIDCRAFT_GPU: software
      SOLIDCRAFT_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install a software Vulkan driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The GPU path tracer's own tests (no engine code) run out of memory or time on 4 vCPUs.
      - name: Tests (the pull request's default filter)
        run: >-
          cargo nextest run --workspace --cargo-profile ci --locked --profile ci --no-tests=pass --partition hash:${{ matrix.shard }}/4
          -E 'default() - (package(solidcraft-gpu) & test(/^path::/))'
  transcript:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOLIDCRAFT_GPU: software
    steps:
      - uses: actions/checkout@v4
      - name: Install Xvfb and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 xvfb xauth libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libegl1 libgl1 libx11-xcb1
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p solidcraft --profile ci --locked
      - name: A subscribed client while another changes the design
        run: |
          cat > "$RUNNER_TEMP/transcript.py" <<'PY'
          import json, os, secrets, socket, subprocess, sys, threading, time
          token = secrets.token_hex(32)
          env = dict(os.environ, SOLIDCRAFT_CONTROL_TOKEN=token, SOLIDCRAFT_CONTROL_DIR=os.path.join(os.environ["RUNNER_TEMP"], "control"))
          log = open(os.path.join(os.environ["RUNNER_TEMP"], "app.log"), "wb")
          app = subprocess.Popen(["xvfb-run", "-a", "-s", "-screen 0 1600x1000x24 -nolisten tcp", "target/ci/solidcraft", "--control", "18846"],
                                 env=env, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)

          def connect():
              deadline = time.monotonic() + 120
              while True:
                  try:
                      return socket.create_connection(("127.0.0.1", 18846), timeout=60)
                  except OSError:
                      if app.poll() is not None or time.monotonic() > deadline:
                          sys.exit("the app never listened")
                      time.sleep(0.3)

          def compact(v):
              return json.dumps(v, separators=(",", ":"), ensure_ascii=False)

          printing = threading.Lock()
          def say(text):
              with printing:
                  print(text, flush=True)

          # A: the subscribed client. It only listens after subscribing.
          a = connect()
          a_in, a_out = a.makefile("r", encoding="utf-8"), a.makefile("w", encoding="utf-8")
          a_out.write(compact({"id": 1, "method": "control.subscribe", "params": {}, "token": token}) + "\n")
          a_out.flush()
          say('A: {"id":1,"method":"control.subscribe","params":{},"token":"…"}')
          first = json.loads(a_in.readline())
          say("A ← " + compact(first))
          if first.get("ok") is not True:
              sys.exit(f"control.subscribe failed: {first}")
          events, replies = [], []
          def listen():
              for line in a_in:
                  msg = json.loads(line)
                  (events if "event" in msg else replies).append(msg)
                  say("A ← " + compact(msg))
          threading.Thread(target=listen, daemon=True).start()

          # B: another client changing the design.
          b = connect()
          b_io = b.makefile("rw", encoding="utf-8")
          n = 0
          def call(method, params, quiet=False):
              global n
              n += 1
              req = {"id": n, "method": method, "params": params}
              if n == 1:
                  req["token"] = token
              b_io.write(compact(req) + "\n")
              b_io.flush()
              reply = json.loads(b_io.readline())
              if reply.get("ok") is not True:
                  sys.exit(f"{method} failed: {reply}")
              if not quiet:
                  shown = {k: ("…" if k == "token" else v) for k, v in req.items()}
                  say("B: " + compact(shown) + ("   → " + compact(reply["result"]) if method == "document.revision" else "   (ok)"))
              return reply

          def step(method, params, expect):
              before = len(events)
              call(method, params)
              time.sleep(0.6)
              got = len(events) - before
              if got != expect:
                  sys.exit(f"{method} {params}: {got} events, expected {expect}")

          step("engine.execute", {"command": "solid.box", "params": {"length": 30, "width": 20, "height": 10}}, 1)
          step("engine.execute", {"command": "select.clear", "params": {}}, 0)
          step("document.inspect", {}, 0)
          step("engine.execute", {"command": "parameters.add", "params": {"name": "w", "expression": "12 mm"}}, 1)
          step("engine.execute", {"command": "edit.undo", "params": {}}, 1)
          step("ui.documents", {"action": "new"}, 1)
          step("ui.documents", {"action": "switch", "index": 0}, 1)
          if events[-1]["params"]["document_id"] != first["result"]["document_id"] or events[-2]["params"]["document_id"] == first["result"]["document_id"]:
              sys.exit("the tab switches did not name the tabs")
          step("engine.execute", {"command": "parameters.add", "params": {"name": "w", "expression": "12 mm"}}, 1)
          # A burst: twenty changes, each its own request (and frame), as fast as B can send them.
          before = len(events)
          say("B: twenty parameters.change requests, w = 13 mm … 32 mm, back to back")
          for i in range(20):
              call("engine.execute", {"command": "parameters.change", "params": {"name": "w", "expression": f"{13 + i} mm"}}, quiet=True)
          time.sleep(0.6)
          burst = len(events) - before
          say(f"(the burst: 20 changes, {burst} design.changed lines)")
          now = call("document.revision", {})
          if not 1 <= burst < 20 or events[-1]["params"] != now["result"]:
              sys.exit(f"burst: {burst} events, last {events[-1]}, now {now}")
          # A's own requests are still answered, between events.
          a_out.write(compact({"id": 2, "method": "document.revision", "params": {}}) + "\n")
          a_out.flush()
          say('A: {"id":2,"method":"document.revision","params":{}}')
          time.sleep(0.6)
          if not replies or replies[-1].get("id") != 2:
              sys.exit(f"A's reply: {replies}")
          call("app.quit", {"force": True})
          app.wait(timeout=60)
          PY
          set -o pipefail
          python3 -I "$RUNNER_TEMP/transcript.py" | tee transcript.txt
      - if: always()
        run: tail -c 12000 "$RUNNER_TEMP/app.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcript
          path: transcript.txt
